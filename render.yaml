# This configuration uses paid compute because durable SQLite requires a disk.
services:
  - type: web
    name: iloveforms-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    disk:
      name: iloveforms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/forms.sqlite3
      - key: COOKIE_SECURE
        value: "true"
